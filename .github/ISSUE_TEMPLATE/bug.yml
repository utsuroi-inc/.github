name: 不具合の報告
description: 正常に動かない、表示がおかしいなどの問題を報告します
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        公開Issueです。画面写真やログを貼る前に、顧客情報、個人情報、パスワード、APIキーが含まれていないか確認してください。
        セキュリティ上の問題はIssueを作らず、SECURITY.mdの窓口へ連絡してください。
  - type: textarea
    id: actual
    attributes:
      label: 何が起きましたか？
      description: 実際に起きたことを書いてください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を順番に書いてください。
      placeholder: |
        1. ○○を開く
        2. △△を選ぶ
        3. 保存を押す
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 本来どうなる想定ですか？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 利用環境
      description: OS、ブラウザ、アプリの版など、分かる範囲で書いてください。
      placeholder: 例：Windows 11 / Chrome 140 / v0.0.2
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 秘密情報を除いたエラーメッセージや画像があれば追加してください。
