name: Governance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check required documents
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            AGENTS.md
            CLAUDE.md
            README.md
            GOVERNANCE.md
            CONTRIBUTING.md
            SECURITY.md
            SECURE_DEVELOPMENT.md
            RELEASE_GATES.md
            ROLLOUT_PLAN.md
            OPERATION_PLAYBOOK.md
            templates/workflows/secure-node-ci.yml
            templates/workflows/secure-static-ci.yml
            templates/static-app/verify-static.mjs
            templates/static-app/verify-static.test.mjs
            .github/ISSUE_TEMPLATE/task.yml
            .github/ISSUE_TEMPLATE/bug.yml
            .github/ISSUE_TEMPLATE/config.yml
            .github/pull_request_template.md
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }' \
            .github/ISSUE_TEMPLATE/task.yml \
            .github/ISSUE_TEMPLATE/bug.yml \
            .github/ISSUE_TEMPLATE/config.yml \
            .github/workflows/docs-check.yml \
            templates/workflows/secure-node-ci.yml \
            templates/workflows/secure-static-ci.yml

      - name: Setup Node.js for security template tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Validate JavaScript and failure tests
        run: |
          node --check templates/static-app/verify-static.mjs
          node --test templates/static-app/verify-static.test.mjs
